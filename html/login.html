<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập | SpendWise</title>

</head>
<body>
<div id="toast" class="toast"></div><main class="auth-page"><section class="auth-side"><a class="brand" href="home.html">SpendWise</a><h2>Tiền rõ ràng.<br>Tương lai nhẹ<br>nhàng.</h2><span class="screen-code">SW-03 • Login</span></section><section class="auth-main"><form id="loginForm" class="auth-card"><h1>Chào mừng trở lại</h1><p>Đăng nhập để tiếp tục quản lý ngân sách.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="Email"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required placeholder="Mật khẩu"></div><p id="message" class="form-message"></p><button class="btn btn-primary btn-block">Đăng nhập</button><div class="auth-links"><a href="forgot-password.html">Quên mật khẩu?</a><span>•</span><span>Chưa có tài khoản?</span><a href="register.html">Đăng ký</a></div></form></section></main>
<script src="../js/login.js" defer></script>
