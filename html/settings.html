<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SpendWise - Quản lý ngân sách và thói quen chi tiêu">
<title>Cài đặt | SpendWise</title>
<link rel="stylesheet" href="../css/settings.css">
</head>
<body>
<div id="toast" class="toast" aria-live="polite"></div><div id="toast" class="toast" aria-live="polite"></div>
<div class="app-shell">
  <aside id="sidebar" class="sidebar">
    <a class="brand" href="home.html">SpendWise</a><div id="roleBadge" class="role-badge"></div>
    <nav id="sidebarNav" class="nav-list"></nav>
    <div class="sidebar-bottom"><button id="logoutBtn" class="btn btn-outline">Đăng xuất</button></div>
  </aside>
  <div class="app-area">
    <header class="topbar"><button id="mobileMenu" class="mobile-menu" aria-label="Mở menu">☰</button><div class="search-wrap"><input id="globalSearch" class="search-input" placeholder="Tìm kiếm nhanh..."></div><div id="userInitials" class="avatar">US</div></header>
    <main class="content-area"><div class="page-heading"><h1>Cài đặt</h1><span class="screen-code">SW-20 • Settings</span></div><section id="stats" class="stats-grid"></section><section class="panel"><div class="panel-header"><h2>Tùy chọn tài khoản</h2></div><div class="settings-grid"><div class="setting-box"><h3>Giao diện</h3><div class="field"><label>Chế độ</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div></div><div class="setting-box"><h3>Thiết lập</h3><div class="field"><label>Tiền tệ</label><select id="currency"><option>VND</option><option>USD</option></select></div><div class="field"><label>Múi giờ</label><select id="timezone"><option>GMT+7</option><option>GMT+8</option></select></div><div class="field"><label>2FA mô phỏng</label><select id="twofa"><option value="off">Tắt</option><option value="on">Bật</option></select></div></div><div class="setting-box"><h3>Dữ liệu</h3><p class="muted">Xóa dữ liệu nghiệp vụ của riêng tài khoản này nhưng giữ tài khoản đăng nhập.</p><button id="clearData" class="btn btn-danger">Xóa dữ liệu của tôi</button></div><div class="setting-box"><h3>Phiên đăng nhập</h3><p class="muted">Đăng xuất để chuyển sang một tài khoản khác.</p><button id="logoutMain" class="btn btn-outline">Đăng xuất</button></div></div></section></main>
  </div>
</div>
<div id="modalOverlay" class="modal-overlay hidden"></div>
<script src="../js/settings.js" defer></script>
</body>
</html>
