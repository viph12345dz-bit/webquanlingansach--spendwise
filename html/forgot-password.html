<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SpendWise - Quản lý ngân sách và thói quen chi tiêu">
<title>Khôi phục mật khẩu | SpendWise</title>
<link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body>
<div id="toast" class="toast"></div><main class="auth-page"><section class="auth-side"><a class="brand" href="home.html">SpendWise</a><h2>Tiền rõ ràng.<br>Tương lai nhẹ<br>nhàng.</h2><span class="screen-code">SW-05 • Forgot Password</span></section><section class="auth-main"><form id="forgotForm" class="auth-card"><h1>Khôi phục mật khẩu</h1><p>Nhập email đã đăng ký. Trong bản Frontend này bạn có thể đặt lại mật khẩu ngay trên trình duyệt.</p><div class="field"><label>Email của bạn</label><input id="email" type="email" required></div><div id="newPasswordFields" class="hidden"><div class="field"><label>Mật khẩu mới</label><input id="newPassword" type="password" minlength="6"></div><div class="field"><label>Nhập lại mật khẩu</label><input id="confirmPassword" type="password" minlength="6"></div></div><p id="message" class="form-message"></p><button id="submitBtn" class="btn btn-primary btn-block">Kiểm tra email</button><div class="auth-links"><a href="login.html">← Quay lại đăng nhập</a></div></form></section></main>
<script src="../js/forgot-password.js" defer></script>
</body>
</html>
