<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SpendWise - Quản lý ngân sách và thói quen chi tiêu">
<title>Đăng ký | SpendWise</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast" class="toast"></div><main class="auth-page"><section class="auth-side"><a class="brand" href="home.html">SpendWise</a><h2>Tiền rõ ràng.<br>Tương lai nhẹ<br>nhàng.</h2><span class="screen-code">SW-04 • Register</span></section><section class="auth-main"><form id="registerForm" class="auth-card"><h1>Tạo tài khoản</h1><p>Bắt đầu xây thói quen tài chính tốt hơn hôm nay.</p><div class="field"><label>Họ và tên</label><input id="name" required></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>Nhập lại mật khẩu</label><input id="confirm" type="password" minlength="6" required></div><div class="field"><label>Loại tài khoản</label><select id="role"><option value="user">Người dùng</option><option value="coach">Coach tài chính giáo dục</option><option value="moderator">Kiểm duyệt viên</option><option value="admin">Quản trị viên</option></select></div><p id="message" class="form-message"></p><button class="btn btn-primary btn-block">Đăng ký</button><div class="auth-links"><span>Đã có tài khoản?</span><a href="login.html">Đăng nhập</a></div></form></section></main>
<script src="../js/modules/register.js" defer></script>
</body>
</html>
