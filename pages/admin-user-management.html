<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý tài khoản và vai trò demo trong SpendWise">
    <title>Quản lý người dùng demo | SpendWise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modules/admin-user-management.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar">
            <a class="brand" href="home.html">SpendWise</a>
            <div id="roleBadge" class="role-badge"></div>
            <nav id="sidebarNav" class="nav-list" aria-label="Điều hướng chính"></nav>
            <div class="sidebar-bottom">
                <button id="logoutBtn" class="btn btn-outline" type="button">Đăng xuất</button>
            </div>
        </aside>
        <div class="app-area">
            <header class="topbar">
                <button id="mobileMenu" class="mobile-menu" type="button"
                    aria-label="Mở menu" aria-expanded="false" aria-controls="sidebar">☰</button>
                <div class="search-wrap">
                    <label class="visually-hidden" for="globalSearch">Tìm tài khoản demo</label>
                    <input id="globalSearch" class="search-input" type="search"
                        placeholder="Tìm tài khoản...">
                </div>
                <div id="userInitials" class="avatar" aria-label="Người dùng hiện tại">US</div>
            </header>
            <main class="content-area">
                <header class="page-heading">
                    <h1>Quản lý tài khoản demo</h1>
                    <span class="screen-code">ADMIN • DEMO</span>
                </header>
                <p class="muted page-note">
                    Tài khoản và vai trò chỉ mô phỏng trên trình duyệt hiện tại; đây không phải
                    chức năng bảo mật thật. Không dùng mật khẩu thật.
                </p>
                <section id="stats" class="stats-grid" aria-label="Thống kê tài khoản"></section>
                <section class="panel">
                    <header class="panel-header">
                        <h2>Tài khoản demo</h2>
                        <div class="panel-tools">
                            <label class="visually-hidden" for="roleFilter">Lọc vai trò</label>
                            <select id="roleFilter" class="filter-select">
                                <option value="all">Tất cả vai trò</option>
                                <option value="user">USER</option>
                                <option value="coach">COACH</option>
                                <option value="moderator">MODERATOR</option>
                                <option value="admin">ADMIN</option>
                            </select>
                            <button id="addBtn" class="btn btn-primary" type="button">
                                + Thêm tài khoản
                            </button>
                        </div>
                    </header>
                    <div id="tableContent" aria-live="polite"></div>
                </section>
            </main>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden"></div>
    <script src="../js/main.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/modules/admin-user-management.js" defer></script>
</body>
</html>
