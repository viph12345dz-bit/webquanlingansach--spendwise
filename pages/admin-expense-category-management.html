<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quản lý danh mục chi tiêu demo của SpendWise">
    <title>Danh mục chi tiêu | SpendWise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modules/admin-expense-category-management.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar">
            <a class="brand" href="home.html">SpendWise</a>
            <div id="roleBadge" class="role-badge"></div>
            <nav id="sidebarNav" class="nav-list" aria-label="Điều hướng chính"></nav>
            <div class="sidebar-bottom">
                <button id="logoutBtn" class="btn btn-outline" type="button">Đăng xuất</button>
            </div>
        </aside>
        <div class="app-area">
            <header class="topbar">
                <button id="mobileMenu" class="mobile-menu" type="button"
                    aria-label="Mở menu" aria-expanded="false" aria-controls="sidebar">☰</button>
                <div class="search-wrap">
                    <label class="visually-hidden" for="globalSearch">Tìm danh mục</label>
                    <input id="globalSearch" class="search-input" type="search"
                        placeholder="Tìm danh mục...">
                </div>
                <div id="userInitials" class="avatar" aria-label="Người dùng hiện tại">US</div>
            </header>
            <main class="content-area">
                <header class="page-heading">
                    <h1>Danh mục chi tiêu</h1>
                    <span class="screen-code">ADMIN • DEMO</span>
                </header>
                <p class="muted page-note">
                    Danh mục demo dùng chung trong trình duyệt này. USER có thể chọn chúng khi
                    trang giao dịch đọc khóa <code>sw_categories</code>.
                </p>
                <section id="stats" class="stats-grid" aria-label="Thống kê danh mục"></section>
                <section class="panel">
                    <header class="panel-header">
                        <h2>Danh mục</h2>
                        <div class="panel-tools">
                            <label class="visually-hidden" for="groupFilter">Lọc nhóm</label>
                            <select id="groupFilter" class="filter-select">
                                <option value="all">Tất cả nhóm</option>
                            </select>
                            <button id="addBtn" class="btn btn-primary" type="button">
                                + Thêm danh mục
                            </button>
                        </div>
                    </header>
                    <div id="tableContent" aria-live="polite"></div>
                </section>
            </main>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden"></div>
    <script src="../js/main.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/modules/admin-expense-category-management.js" defer></script>
</body>
</html>
