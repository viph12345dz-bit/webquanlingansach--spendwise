<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bảng theo dõi trạng thái hệ thống mô phỏng SpendWise">
    <title>Dashboard hệ thống | SpendWise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modules/admin-system-dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar">
            <a class="brand" href="home.html">SpendWise</a>
            <div id="roleBadge" class="role-badge"></div>
            <nav id="sidebarNav" class="nav-list" aria-label="Điều hướng chính"></nav>
            <div class="sidebar-bottom">
                <button id="logoutBtn" class="btn btn-outline" type="button">Đăng xuất</button>
            </div>
        </aside>
        <div class="app-area">
            <header class="topbar">
                <button id="mobileMenu" class="mobile-menu" type="button"
                    aria-label="Mở menu" aria-expanded="false" aria-controls="sidebar">☰</button>
                <div class="search-wrap">
                    <label class="visually-hidden" for="globalSearch">Tìm thành phần demo</label>
                    <input id="globalSearch" class="search-input" type="search"
                        placeholder="Tìm thành phần...">
                </div>
                <div id="userInitials" class="avatar" aria-label="Người dùng hiện tại">US</div>
            </header>
            <main class="content-area">
                <header class="page-heading">
                    <h1>Trạng thái hệ thống</h1>
                    <span class="screen-code">ADMIN • DỮ LIỆU MÔ PHỎNG</span>
                </header>
                <p class="muted page-note">
                    Các chỉ số bên dưới là dữ liệu demo để trình bày giao diện, không lấy từ máy chủ.
                </p>
                <section id="stats" class="stats-grid" aria-label="Trạng thái hệ thống"></section>
                <section class="panel">
                    <header class="panel-header">
                        <h2>Thành phần theo dõi demo</h2>
                        <button id="addBtn" class="btn btn-primary" type="button">
                            + Thêm cấu hình
                        </button>
                    </header>
                    <div id="tableContent" aria-live="polite"></div>
                </section>
            </main>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden"></div>
    <script src="../js/main.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/modules/admin-system-dashboard.js" defer></script>
</body>
</html>
