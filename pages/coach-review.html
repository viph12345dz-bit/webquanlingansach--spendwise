<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review ngân sách và nhận xét Coach SpendWise">
    <title>Review ngân sách | SpendWise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modules/coach-review.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div id="toast" class="toast" aria-live="polite"></div>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar">
            <a class="brand" href="home.html">SpendWise</a>
            <div id="roleBadge" class="role-badge"></div>
            <nav id="sidebarNav" class="nav-list" aria-label="Điều hướng chính"></nav>
            <div class="sidebar-bottom">
                <button id="logoutBtn" class="btn btn-outline" type="button">Đăng xuất</button>
            </div>
        </aside>
        <div class="app-area">
            <header class="topbar">
                <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Mở menu">☰</button>
                <div class="search-wrap">
                    <label class="visually-hidden" for="globalSearch">Tìm nhận xét</label>
                    <input id="globalSearch" class="search-input" type="search" placeholder="Tìm trong nhận xét...">
                </div>
                <div id="userInitials" class="avatar">US</div>
            </header>
            <main class="content-area">
                <header class="page-heading">
                    <div>
                        <h1>Review ngân sách</h1>
                        <p class="muted">Số liệu từ giao dịch và ngân sách đã lưu trong trình duyệt.</p>
                    </div>
                    <span class="screen-code">SW-10 • Coach Budget Review</span>
                </header>
                <section class="panel review-filters">
                    <div class="field">
                        <label for="clientSelect">Khách hàng</label>
                        <select id="clientSelect" class="filter-select"></select>
                    </div>
                    <div class="field">
                        <label for="periodFilter">Tháng</label>
                        <input id="periodFilter" type="month">
                    </div>
                    <button id="addNoteBtn" class="btn btn-primary" type="button">+ Thêm nhận xét</button>
                </section>
                <section id="budgetSummary" class="budget-summary" aria-live="polite"></section>
                <section id="stats" class="stats-grid" aria-label="Thống kê nhận xét"></section>
                <section class="panel">
                    <header class="panel-header">
                        <h2>Nhận xét Coach</h2>
                        <div class="panel-tools">
                            <label class="visually-hidden" for="statusFilter">Lọc nhận xét</label>
                            <select id="statusFilter" class="filter-select">
                                <option value="all">Tất cả trạng thái</option>
                                <option value="draft">Bản nháp</option>
                                <option value="shared">Đã chia sẻ</option>
                            </select>
                        </div>
                    </header>
                    <div id="tableContent"></div>
                </section>
            </main>
        </div>
    </div>
    <div id="modalOverlay" class="modal-overlay hidden"></div>
    <script src="../js/main.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/modules/coach-review.js" defer></script>
</body>
</html>
