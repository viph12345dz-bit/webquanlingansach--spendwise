<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SpendWise - Quản lý ngân sách và thói quen chi tiêu">
    <title>Khôi phục mật khẩu | SpendWise</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/modules/forgot-password.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-side">
            <a class="brand" href="home.html">SpendWise</a>
            <h1>Tiền rõ ràng.<br>Tương lai nhẹ nhàng.</h1>
            <span class="screen-code">SW-05 • Forgot Password</span>
        </section>

        <section class="auth-main">
            <form id="resetForm" class="auth-card" novalidate>
                <h2>Khôi phục mật khẩu</h2>
                <p class="muted">Chỉ đặt lại mật khẩu DEMO ngay trong trình duyệt, không gửi email hay xác minh danh tính. Không dùng tài khoản thật.</p>

                <div class="field">
                    <label for="email">Email của bạn</label>
                    <input id="email" type="email" autocomplete="email" maxlength="254" required>
                </div>

                <div class="field">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input id="newPassword" type="password" autocomplete="new-password" maxlength="72" minlength="6" required>
                </div>

                <div class="field">
                    <label for="confirmPassword">Nhập lại mật khẩu</label>
                    <input id="confirmPassword" type="password" autocomplete="new-password" maxlength="72" minlength="6" required>
                </div>

                <p id="message" class="form-message" role="status" aria-live="polite"></p>

                <button class="btn btn-primary btn-block" type="submit">Đặt lại mật khẩu</button>

                <nav class="auth-links">
                    <a href="login.html">← Quay lại đăng nhập</a>
                </nav>
            </form>
        </section>
    </main>

    <script src="../js/main.js" defer></script>
    <script src="../js/modules/sv1-auth.js" defer></script>
    <script src="../js/modules/forgot-password.js" defer></script>
</body>
</html>
