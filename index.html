<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise - Quản lý tài chính cá nhân</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <section id="authScreen" class="auth-screen">
    <div class="auth-brand">
      <div class="logo-mark">S</div>
      <h1>SpendWise</h1>
      <p>Quản lý ngân sách, giao dịch và mục tiêu tiết kiệm của bạn.</p>
      <div class="auth-features">
        <span>✓ Lưu dữ liệu trên trình duyệt</span>
        <span>✓ CRUD giao dịch & mục tiêu</span>
        <span>✓ AI mô phỏng hỗ trợ tài chính</span>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="login">Đăng nhập</button>
        <button class="auth-tab" data-auth="register">Đăng ký</button>
      </div>

      <form id="loginForm" class="auth-form">
        <h2>Chào mừng trở lại</h2>
        <label>Tên đăng nhập
          <input id="loginUsername" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập" />
        </label>
        <label>Mật khẩu
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" />
        </label>
        <p id="loginMessage" class="form-message"></p>
        <button class="primary-btn" type="submit">Đăng nhập</button>
        <button class="text-btn" id="demoBtn" type="button">Dùng tài khoản demo</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <h2>Tạo tài khoản mới</h2>
        <label>Họ và tên
          <input id="registerName" type="text" placeholder="Ví dụ: Nguyễn Văn A" />
        </label>
        <label>Tên đăng nhập
          <input id="registerUsername" type="text" placeholder="Tối thiểu 4 ký tự" />
        </label>
        <label>Mật khẩu
          <input id="registerPassword" type="password" placeholder="Tối thiểu 6 ký tự" />
        </label>
        <label>Nhập lại mật khẩu
          <input id="registerConfirm" type="password" placeholder="Nhập lại mật khẩu" />
        </label>
        <label>Vai trò
          <select id="registerRole">
            <option value="user">Người dùng</option>
            <option value="coach">Huấn luyện viên tài chính</option>
            <option value="moderator">Kiểm duyệt viên</option>
            <option value="admin">Quản trị viên</option>
          </select>
        </label>
        <p id="registerMessage" class="form-message"></p>
        <button class="primary-btn" type="submit">Đăng ký</button>
      </form>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="logo-mark small">S</div>
        <div><strong>SpendWise</strong><small>Tài chính thông minh</small></div>
      </div>
      <nav id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="mini-user">
          <div id="avatar" class="avatar">U</div>
          <div><strong id="miniUserName">User</strong><small id="miniUserRole">Người dùng</small></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only" aria-label="Mở menu">☰</button>
        <div><p class="eyebrow">SpendWise</p><h2 id="pageTitle">Tổng quan</h2></div>
        <div class="top-actions">
          <button id="themeBtn" class="icon-btn" title="Đổi giao diện">◐</button>
          <button id="notificationBtn" class="icon-btn" title="Thông báo">🔔<span id="notificationDot" class="dot"></span></button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <button id="closeModal" class="modal-close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
